<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021415" />
      <stop offset="50%" stop-color="#042323" />
      <stop offset="100%" stop-color="#010d0e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df5c4" />
      <stop offset="50%" stop-color="#00c49f" />
      <stop offset="100%" stop-color="#007a68" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#55ffdf" />
      <stop offset="100%" stop-color="#00a887" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00c49f" stroke-width="2" opacity="0.3" stroke-dasharray="12 16" />
  
  <!-- Middle energy orbit -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#tealGrad)" stroke-width="6" opacity="0.8" filter="url(#glow)" />

  <!-- Inner dynamic ring -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="#55ffdf" stroke-width="4" opacity="0.9" />

  <!-- Center Glowing Core Orb -->
  <circle cx="256" cy="256" r="62" fill="url(#coreGrad)" filter="url(#glow)" />

  <!-- A-shaped sleek futuristic lettermark -->
  <path d="M256 200 L285 285 L227 285 Z" fill="none" stroke="#021415" stroke-width="9" stroke-linejoin="round" />
  <circle cx="256" cy="245" r="7" fill="#021415" />

  <!-- Orbital satellite particles -->
  <circle cx="395" cy="220" r="10" fill="#0df5c4" filter="url(#glow)" />
  <circle cx="125" cy="305" r="7" fill="#55ffdf" filter="url(#glow)" />
  <circle cx="295" cy="115" r="6" fill="#00c49f" filter="url(#glow)" />
</svg>
